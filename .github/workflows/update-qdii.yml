name: update-qdii-overview

# QDII 场内基金一览页数据刷新（update_qdii.py 幂等，数据无变化不提交）
# - 北京 16:07 收盘后更新；北京 20:43 晚间兜底
# - GitHub schedule 在整点高峰经常延迟/丢弃，故错峰并双重兜底
on:
  schedule:
    - cron: '7 8 * * 1-5'
    - cron: '43 12 * * 1-5'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: update-qdii-overview
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch quotes and update page
        run: python update_qdii.py

      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasdaq100-etf-overview.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh QDII overview (premium/NAV) ($(date -u '+%F %H:%M') UTC)"
            git push
          fi
