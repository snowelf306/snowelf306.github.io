name: update-fund-nav

# 每个交易日（美东收盘后）自动拉取最新行情，重建 QDII 基金净值估算页面并提交
# UTC 21:00 = 北京时间 05:00（次日）。夏令时美股 16:00 ET 收盘 = 20:00 UTC，留 1 小时入库；
# 冬令时 16:00 ET 收盘 = 21:00 UTC 与定时点重合，当日收盘偶发未入库时由下一交易日构建补齐
on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: update-fund-nav
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild fund NAV dashboard
        working-directory: build
        run: |
          node build_data.js
          node make_page.js

      - name: Commit refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qdii-nav.html data.json 
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh fund NAV estimates ($(date -u '+%F %H:%M') UTC)"
            git push
          fi
